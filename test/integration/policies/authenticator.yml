# This policy defines a JWT authenticator for CircleCI
- !policy
  id: conjur/authn-jwt/circleci
  body:
  - !webservice

  # Mandatory variable: How the JWT Authenticator gets the signing keys
  # Uncomment either 'jwks-uri' or 'public-keys'
  - !variable
    id: jwks-uri

  # - !variable
  #   id: public-keys

  # This variable tells Conjur which claim in the JWT to use to determine the host identity.
  - !variable
    id: token-app-property

  # This variable is used with token-app-property. It holds the Conjur policy path that contains the host identity found by looking at the claim in token-app-property.
  - !variable
    id: identity-path

  # Optional: Uncomment if the JWKS website cert isn't trusted by Conjur
  # - !variable
  #   id: ca-cert

  # This variable contains the JWT's "iss" value.
  - !variable
    id: issuer
  
  # This variable contains the JWT's "aud" value.
  - !variable
    id: audience

  ## Group of applications that can authenticate using this JWT Authenticator
  - !group
    id: apps

  # Permit the apps group to authenticate to the JWT authenticator
  - !permit
    role: !group apps
    privilege: [ read, authenticate ]
    resource: !webservice

  # Health check end-point
  - !webservice
    id: status

  # Group of users who can check the status of the JWT Authenticator
  - !group
    id: operators

  # Permit operators to query the health check end-point
  - !permit
    role: !group operators
    privilege: [ read ]
    resource: !webservice status