- !policy
  id: circleci
  body:
    - !variable
      id: firstSecret

    - !variable
      id: secondSecret

    - !variable
      id: emptySecret

    #Intentionally the host is not permitted to use this variable so that we can test access denial case.
    - !variable
      id: secretWithoutHostPermit 

    - !host
      id: 644db9c2-4587-46c1-a53b-8d0889d71b1f
      annotations:
        authn-jwt/circleci/sub: org/c05f5799-3c32-45e3-98dd-cb4e90373966/project/644db9c2-4587-46c1-a53b-8d0889d71b1f/user/58d168f4-5bbd-44ed-bf41-30622b304816/vcs-origin/github.com/conjurinc/playroom/vcs-ref/refs/heads/circleci-project-setup
        authn/api-key: true

    # Permit host to access variable
    - !permit
      role: !host 644db9c2-4587-46c1-a53b-8d0889d71b1f
      privileges: [ read, execute ]
      resource: !variable firstSecret

    - !permit
      role: !host 644db9c2-4587-46c1-a53b-8d0889d71b1f
      privileges: [ read, execute ]
      resource: !variable secondSecret

    - !permit
      role: !host 644db9c2-4587-46c1-a53b-8d0889d71b1f
      privileges: [ read, execute ]
      resource: !variable emptySecret