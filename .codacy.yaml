---
# Codacy configuration file
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

# Exclude files and directories from analysis
exclude_paths:
  # Ignore all markdown files
  - "**/*.md"
  - "**/*.markdown"

  # Ignore documentation directories
  - "docs/**"
  - "documentation/**"

  # Ignore image directory
  - "img/**"

  # Other common paths to ignore (optional)
  # - 'test/**'
  # - 'tests/**'
  # - '**/*.min.js'
  # - 'vendor/**'
