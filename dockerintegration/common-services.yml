services:
  conjur-cli:
    image: cyberark/conjur-cli:9
    container_name: conjur-cli
    networks:
      conjur:
    depends_on:
      - conjur-leader
    entrypoint: sleep
    command: infinity
    environment:
      - CONJUR_URL=https://conjur-leader-1.mycompany.local
      - CONJUR_OSS_URL=https://proxy
      - CONJUR_ACCOUNT=conjur
      - CONJUR_ADMIN_PASSWORD=${CONJUR_ADMIN_PASSWORD:-SecretP@ssw0rd!}
      - JWKS_URI=https://oidc.circleci.com/org/c05f5799-3c32-45e3-98dd-cb4e90373966/.well-known/jwks-pub.json
      - ISSUER=https://oidc.circleci.com/org/c05f5799-3c32-45e3-98dd-cb4e90373966
      - AUDIENCE=c05f5799-3c32-45e3-98dd-cb4e90373966
      - TOKEN_APP_PROPERTY=oidc.circleci.com/project-id
      - IDENTITY_PATH=circleci
    volumes:
      - ../test/integration/policies:/tmp/policies:ro
      - ../test/integration/scripts/configure-cli.sh:/scripts/configure-cli.sh:ro
      - ../test/integration/scripts/configure-jwt.sh:/scripts/configure-jwt.sh:ro
      - ../test/integration/data:/data:ro

  circleci-runner:
    build:
      context: .
      dockerfile: Dockerfile.circleci-runner
    container_name: circle-ci-runner
    networks:
      conjur:
    depends_on:
      - conjur-leader
      - conjur-cli
    environment:
      - CIRCLECI_RUNNER_NAME=integration-tests-runner
      - CIRCLECI_RUNNER_API_AUTH_TOKEN=${RUNNER_API_KEY}
      - CIRCLECI_RESOURCE_CLASS=cyberark-integration-testing/self-hosted-runner